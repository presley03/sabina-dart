name: sabina
description: "SABINA - Pemantau Kesehatan Ibu Hamil"
publish_to: 'none'  # Jangan publish ke pub.dev

version: 1.1.0+47

environment:
  sdk: '>=3.3.0 <4.0.0'  # Fleksibel untuk Flutter 3.22+ hingga 3.27+

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Intl: Pakai 'any' agar ikut versi yang dipin oleh flutter_localizations (0.20.2 di 2026)
  intl: any

  # Fonts
  google_fonts: ^6.1.0

  # Storage & Path
  shared_preferences: ^2.5.4
  path_provider: ^2.1.5
  sqflite: ^2.3.3+1
  path: ^1.9.0

  # UI & Input
  numberpicker: ^2.1.2
  provider: ^6.1.2
  url_launcher: ^6.3.0
  font_awesome_flutter: ^10.7.0
  image_picker: ^1.1.2
  logger: ^2.4.0
  carousel_slider: ^5.0.0
  glassmorphism: ^3.0.0
  photo_view: ^0.15.0

  # Security
  flutter_secure_storage: ^10.0.0
  crypto: ^3.0.5

  # Charts
  fl_chart: ^1.1.1
  syncfusion_flutter_charts: ^32.2.8  # Upgraded from 32.2.5 (minor)

  # Network
  http: ^1.2.2

  # Icons
  cupertino_icons: ^1.0.8

  # Disabled packages (uncomment jika butuh nanti)
  # flutter_local_notifications: ^17.2.3
  # timezone: ^0.9.4
  # permission_handler: ^11.3.1
  # pdf: ^3.11.1
  # printing: ^5.13.3
  # open_file: ^3.5.10
  # dio: ^5.7.0
  # flutter_datetime_picker_plus: ^2.2.0
  # flutter_colorpicker: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0  # Untuk linting lebih baik

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/images/brand/
    - assets/images/common/
    - assets/images/questionnaire/
    - assets/images/keluhan/
    - assets/images/keluhan/icons/
    - assets/images/trimester/
    - assets/images/imt/
    - assets/images/care/
    - assets/images/persalinan/
    - assets/images/tips/
    - assets/images/home/
    - assets/images/resep/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700

flutter_intl:
  enabled: true
  class_name: AppLocalizations
  main_locale: id
  arb_dir: lib/l10n
  output_dir: lib/generated